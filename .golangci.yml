version: "2"

# Posture: every linter on, then switch off the ones whose objection this
# project has already answered — each with its reason, so a future reader can
# re-open the argument instead of guessing why the check is absent.
linters:
  default: all
  disable:
    # Bans TODO/FIXME outright. Staged work is the method here: a TODO naming
    # the stage that owns it is better than silence about the same gap.
    - godox
    # Requires an allowlist of permitted imports. The dependency policy lives
    # in the specification and is enforced by scripts/check-pins.sh, which can
    # state its reasons; a second list here would drift from the first.
    - depguard
    # Every struct literal must set every field. Zero values are load-bearing
    # here — the schema's defaults mirror them deliberately.
    - exhaustruct
    # Minimum identifier length. Short names in short scopes read better,
    # and this codebase is full of them (tx, db, id, fh).
    - varnamelen
    # Blank-line placement, three ways. gofumpt already settles formatting;
    # more opinions about whitespace buy nothing.
    - wsl
    - wsl_v5
    - nlreturn
    # Global state is genuinely used for build identity (version.Version is
    # set by -ldflags at release time).
    - gochecknoglobals
    # Bans `if err := f(); err != nil` — the standard library's own idiom,
    # and the one that keeps err scoped to the branch that handles it.
    # Widening a variable's scope to satisfy a linter is the wrong trade.
    - noinlineerr
    # Superseded by gomodguard_v2, which stays enabled by the default:all
    # posture; running both only produces a deprecation warning per run.
    - gomodguard
  exclusions:
    rules:
      # Table-driven fixture suites are this project's test idiom (one
      # subtest per inventory row, S1b onward). A fixture table IS one long
      # function of repeated literals by design: splitting it to satisfy a
      # length ceiling scatters the row<->subtest mapping, and hoisting SQL
      # status strings into constants makes each fixture read as
      # indirection instead of as the statement under test. Production code
      # keeps all five checks.
      - path: '_test\.go'
        linters:
          - funlen
          - gocognit
          - cyclop
          - goconst
          - maintidx

formatters:
  enable:
    - gofmt
    - gofumpt
