name: gates

# Authored at stage S0 (execution plan, D-EP8); first exercised at the first
# push. v0 targets POSIX (docs/v0-spec.md §16): the full gate suite runs on
# ubuntu + macos, and Windows verifies only what the spec asks of it — dump
# byte-determinism (the serializer emits identical LF bytes across OS). Hook
# scripts and CLI behaviour are POSIX-only by design and are exercised on the
# POSIX runners; full Windows support is out of v0 scope (tracked separately).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.26.5
  CGO_ENABLED: "0"

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build -trimpath ./...

      - name: vet
        run: go vet ./...

      - name: test
        # The race detector requires cgo; the repo is otherwise cgo-free
        # (modernc.org/sqlite is pure Go, and the shipped build is verified
        # cgo-free by the build step above). Enable cgo for this step only,
        # or `-race` fails on Linux/Windows with CGO_ENABLED=0.
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      - name: lint
        run: go tool golangci-lint run ./...

      - name: modern idiom (both halves of the gate)
        shell: bash
        run: |
          out="$(go fix -diff ./... 2>&1)"; status=$?
          if [ -n "$out" ] || [ $status -ne 0 ]; then
            printf '%s\n' "$out" >&2
            echo "pending modernisations (exit $status)" >&2
            exit 1
          fi

      - name: vulnerabilities
        run: go tool govulncheck ./...

  windows-dump-determinism:
    # v0 targets POSIX; on Windows the spec asks only that the serializer emit
    # the same LF bytes it does elsewhere (docs/v0-spec.md §16). Just the dump
    # package, cgo-free, no race detector — the POSIX-only hook/CLI tests are
    # deliberately not run here.
    name: dump determinism (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: dump byte-determinism
        run: go test ./internal/dump/...

  policy:
    name: policy gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: dependency pins
        run: ./scripts/check-pins.sh

      - name: go fix exit-code behaviour on the pinned toolchain
        run: ./scripts/probe-gofix.sh

      # The fixture first, then the comparison, mirroring `make check-copies`:
      # the comparison reporting "no drift" means nothing until something has
      # shown it can report drift. A gate that only `make` runs binds only
      # whoever types `make`, and every commit passes through here instead.
      - name: installed copies match the templates they ship
        run: |
          ./scripts/check-installed-copies-fixture.sh
          ./scripts/check-installed-copies.sh

      # traceability accounting retired at S10 with the inventory it checked
      # (plan section 9); scripts/check-inventory.py stays for the file in git history.
